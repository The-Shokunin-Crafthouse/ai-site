# Do not edit here — update the canonical template and re-propagate.
name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
      REMOTE_PORT: "65002"
      PREVIEW_PATH: ~/domains/levibahn.com/public_html/ai/_previews/${{ github.event.pull_request.number }}/
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Tear down preview directory (with retry)
        uses: nick-fields/retry@v4
        env:
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 10
          command: |
            ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "rm -rf $PREVIEW_PATH"

      - name: Comment cleanup confirmation
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🧹 Preview \`/_previews/${prNumber}/\` torn down.`,
            });
