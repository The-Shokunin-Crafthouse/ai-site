# Propagated from studio-memory/templates/github-workflows/preview-deploy.yml (2026-06-05).
# Do not edit here — update the canonical template and re-propagate.
name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
      REMOTE_PORT: "65002"
      PREVIEW_PATH: ~/domains/levibahn.com/public_html/ai/_previews/${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Block search indexing
        run: |
          printf "User-agent: *\nDisallow: /\n" > robots.txt

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      # mkdir is folded into --rsync-path: one connection instead of two, and it retries.
      - name: Deploy preview via rsync (with retry)
        uses: nick-fields/retry@v2
        env:
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 10
          command: |
            rsync -avzr --delete \
              --rsync-path="mkdir -p $PREVIEW_PATH && rsync" \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.DS_Store' \
              --exclude='node_modules/' \
              --exclude='WORKSPACE.md' \
              --exclude='WORKFLOW.md' \
              --exclude='workspace.manifest.yaml' \
              --exclude='adapters/' \
              --exclude='_config/' \
              --exclude='decisions/' \
              --exclude='stages/' \
              --exclude='previews/' \
              --exclude='_previews/' \
              --exclude='package.json' \
              --exclude='package-lock.json' \
              --exclude='content/' \
              --exclude='_archive/' \
              --exclude='_pending/' \
              --exclude='_snapshots/' \
              --exclude='snapshots/' \
              --exclude='docs/' \
              --exclude='SPEC.md' \
              --exclude='README.md' \
              --exclude='ai-site-update-cowork-task.md' \
              --exclude='icons/phosphor.svg' \
              -e "ssh -p $REMOTE_PORT" \
              ./ "$REMOTE_USER@$REMOTE_HOST:$PREVIEW_PATH"

      - name: Post or update sticky preview comment
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://ai.levibahn.com/_previews/${prNumber}/`;
            const marker = '<!-- ai-site-preview-comment -->';
            const body = [
              marker,
              `🔗 **Preview ready**`,
              ``,
              `${url}`,
              ``,
              `_Same URL on phone — copy and paste into iMessage._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
