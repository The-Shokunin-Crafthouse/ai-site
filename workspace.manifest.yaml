# ============================================================
# workspace.manifest.yaml
# ============================================================
# Minimal manifest (project block only). Written 2026-09-02 for Studio PM
# (decision F, ADR-073: every repo carries a manifest). This repo does not use the
# five-stage project-template layout, so only the keys the studio's tooling reads
# are set. Grow it toward templates/project-template/workspace.manifest.yaml when
# the repo is brought onto the template. Do not delete keys — mark deprecated.
# ============================================================

